services:
  db:
    image: postgres:16-alpine
    container_name: vrm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vendo}
      POSTGRES_USER: ${POSTGRES_USER:-vendo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vendo} -d ${POSTGRES_DB:-vendo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    networks: [vrm]
  api:
    build: ./api
    container_name: vrm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vendo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vendo}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/@prisma/engines/libquery_engine-debian-openssl-3.0.x.so.node
      PRISMA_SCHEMA_ENGINE_BINARY: /app/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./:/workspace
      - ./api/dist:/app/dist
      - ./api/prisma:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [vrm]
  web:
    build: ./web
    container_name: vrm-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on: [api]
    networks: [vrm]
volumes:
  postgres_data:
  uploads:
networks:
  vrm:
    driver: bridge
